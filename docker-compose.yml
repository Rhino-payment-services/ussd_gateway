services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ussd
      POSTGRES_PASSWORD: ussd_secret
      POSTGRES_DB: ussd_gateway
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ussd -d ussd_gateway"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://ussd:ussd_secret@postgres:5432/ussd_gateway?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-in-production-use-long-random-string
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:5173
      SESSION_TTL_SECONDS: 180
      WEBHOOK_TIMEOUT_MS: 8000
      ALLOW_ANONYMOUS_SIMULATE: "true"
      SIMULATE_RATE_LIMIT_WINDOW_MS: 60000
      SIMULATE_RATE_LIMIT_MAX: 300
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
        VITE_SOCKET_URL: http://localhost:4000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
